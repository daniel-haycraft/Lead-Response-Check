name: Lead Callback Check

on:
  schedule:
    # 6:42pm America/Phoenix, Mon-Fri. Arizona has no DST, so 6:42pm AZ is always 01:42 UTC the next day,
    # which is why the day-of-week field is Tue-Sat in UTC.
    - cron: "42 1 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print results only, no sheet write, no email"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run lead callback check
        run: python lead_callback_check.py
        env:
          # Secrets (Settings -> Secrets and variables -> Actions -> Secrets)
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          # Variables (Settings -> Secrets and variables -> Actions -> Variables). All optional.
          HUBSPOT_LIST_ID: ${{ vars.HUBSPOT_LIST_ID || '19329' }}
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID || '6624066' }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'daniel.haycraft@capitalfund1.com' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || 'Master' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Phoenix' }}
          BUSINESS_START: ${{ vars.BUSINESS_START || '8' }}
          BUSINESS_END: ${{ vars.BUSINESS_END || '17' }}
          RECHECK_DAYS: ${{ vars.RECHECK_DAYS || '7' }}
          REPORT_DAY_ONLY: ${{ vars.REPORT_DAY_ONLY || 'true' }}
          EXCLUDE_FORMS: ${{ vars.EXCLUDE_FORMS || 'Credit Auth' }}

          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DRY_RUN_HTML: email_preview.html

      - name: Save email preview (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: email_preview.html
